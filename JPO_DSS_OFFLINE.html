<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1b3030">
  <meta name="description" content="Ruang kerja riset prioritas lokasi penyeberangan Jatinangor berbasis Fuzzy AHP, TOPSIS, dan validasi IoT agregat.">
  <title>JPO Decision Lab — Jatinangor</title>
  <style>
/* JPO Decision Lab · Interface system
   Visual register: transport-planning desk / field-report clarity.
   No remote fonts, icon libraries, or decorative imagery. */
:root {
  color-scheme:light;
  --canvas:#f5f5f1;
  --surface:#fbfcf9;
  --surface-quiet:#f1f3ed;
  --text:#1b302e;
  --text-deep:#102722;
  --muted:#61716d;
  --faint:#596c61;
  --border:#d7dfd7;
  --border-strong:#b9c8bb;
  --forest:#294f44;
  --forest-deep:#162e2a;
  --olive:#576e49;
  --lime:#d8e6a4;
  --caution:#955f38;
  --caution-bg:#f5ecdf;
  --focus:#7ba37d;
  --font-body:'Aptos','Segoe UI',ui-sans-serif,sans-serif;
  --font-display:'Bahnschrift','Aptos Display','Segoe UI',sans-serif;
  --font-mono:'Cascadia Code','Consolas',ui-monospace,monospace;
  --sidebar:270px;
  font-family:var(--font-body);
  color:var(--text);
  background:var(--canvas);
  font-synthesis:none;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.52}
button,input,textarea,select,a{touch-action:manipulation}
:where(button,input,select,textarea,a):focus-visible{outline:3px solid var(--focus);outline-offset:3px}
::selection{background:var(--lime);color:var(--text-deep)}
a{color:#235947;text-decoration-thickness:1px;text-underline-offset:3px}
img,svg{max-width:100%}
.skip-link{position:absolute;z-index:1000;left:10px;top:-60px;padding:10px 16px;background:var(--forest-deep);color:white}
.skip-link:focus{top:10px}
.hidden{display:none!important}
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.rail{background:var(--forest-deep);color:#eef2e9;padding:33px 19px 24px;display:flex;flex-direction:column;min-width:0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:15px;padding:0 9px 33px;border-bottom:1px solid rgba(227,238,229,.16)}
.crossing-mark{display:flex;align-items:center;justify-content:center;width:39px;height:40px;flex:none;gap:4px;transform:skewY(-11deg)}
.crossing-mark span{display:block;height:26px;width:5px;background:#dcdfb4;transform:rotate(0);border-radius:1px}
.brand strong{display:block;font-family:var(--font-display);font-size:18px;font-weight:720;letter-spacing:-.045em;line-height:1.12}
.brand small{display:block;color:#bbcac1;font-size:11px;margin-top:6px;letter-spacing:.01em}
.rail-section{font-size:11px;font-weight:650;letter-spacing:.03em;color:#94aba0;margin:31px 12px 10px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:13px;width:100%;min-height:45px;padding:10px 12px;color:#cad8d0;background:none;border:1px solid transparent;border-radius:3px;text-align:left;font-size:13px;font-weight:510;transition:background .14s,color .14s,border-color .14s}
.nav-step{font-family:var(--font-mono);font-size:10px;letter-spacing:-.03em;color:#93b1a4;min-width:21px}
.nav:hover{background:#294740;color:#fff}
.nav.active{background:#dce6d0;color:#183c31;font-weight:730;border-color:#c8d5c3}
.nav.active .nav-step{color:#3e6952}
.rail-progress{margin:34px 7px 0;border-top:1px solid #456055;padding-top:20px;color:#c0cec2}
.rail-progress small{display:block;font-size:11px;color:#aabdb1;margin-bottom:7px}
.rail-progress strong{display:block;font-family:var(--font-display);font-size:26px;line-height:1.2;color:#edf4e9;font-weight:600;letter-spacing:-.035em}
.rail-progress span{display:block;font-size:11px;line-height:1.6;color:#b6c6bb;margin-top:8px}
.progress-track{width:100%;height:4px;background:#49635a;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;background:#dbe7b5;width:0;transition:width .18s ease-out}
.rail-foot{margin:auto 10px 0;padding-top:23px;border-top:1px solid #456055;display:flex;flex-direction:column;gap:7px}
.rail-foot b{font-size:12px;letter-spacing:.01em;color:#e1eadd;font-weight:620}
.rail-foot span{font-size:11px;color:#abbcaf;line-height:1.55}
.workspace{min-width:0;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px;padding:0 clamp(26px,3.3vw,74px);background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-size:12px;color:#5f716a;font-weight:580}
.header-right{display:flex;align-items:center;gap:24px;min-width:0}
.top-context{font-size:11px;color:#7e8981}
.state{display:inline-flex;align-items:center;padding:7px 10px;white-space:nowrap;border:1px solid #cbd6c9;background:#eff3eb;border-radius:3px;color:#476344;font-size:11px;font-weight:650}
.main{width:100%;max-width:none;margin:0;min-width:0;padding:clamp(30px,2.55vw,58px) clamp(26px,3.3vw,74px) 100px}
.main h1,.main h2,.main h3{font-family:var(--font-display);letter-spacing:-.035em}
.main h1{font-size:clamp(30px,2.45vw,48px);line-height:1.12;font-weight:620;margin:0 0 16px}
.main h2{font-size:22px;line-height:1.18;font-weight:660;margin:0}
.main h3{font-size:16px;font-weight:680;line-height:1.3;margin:0 0 12px}
.main p{overflow-wrap:break-word}
.eyebrow{margin:0 0 14px;font-size:12px;font-weight:550;color:#64766c}
.intro{max-width:78ch;font-size:14px;line-height:1.72;color:var(--muted);margin:0 0 29px}
/* Editorial project landing: evidence matrix is the central visual, not a decorative hero. */
.brief-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,285px);gap:clamp(35px,5vw,100px);align-items:end;margin:1px 0 35px}
.brief-index{font-size:12px;color:#506d57;font-weight:700;margin-bottom:19px}
.brief-intro h1{font-size:clamp(39px,3.2vw,68px);max-width:17ch;line-height:1.045;letter-spacing:-.057em;margin:0 0 23px;color:var(--text-deep);font-weight:630;text-wrap:balance}
.brief-intro>p{font-size:clamp(14px,1.03vw,17px);line-height:1.58;max-width:67ch;color:#546960;margin:0 0 25px}
.brief-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brief-actions>span{font-size:11px;color:#6b7b73}
.brief-aside{padding:17px 0 8px 23px;border-left:1px solid var(--border-strong);color:#50675c;align-self:stretch;display:flex;flex-direction:column;justify-content:end}
.brief-aside-title{margin:0 0 13px;font-size:12px;color:#5b7662;font-weight:660}
.brief-aside dl{margin:0}
.brief-aside dl>div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border)}
.brief-aside dt{color:#708175;font-size:12px}.brief-aside dd{margin:0;font-size:13px;font-weight:700;color:#264539}
.brief-aside>p:last-child{color:#6c776d;font-size:12px;line-height:1.6;margin:18px 0 0}
.measures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);padding:20px 0 23px;margin-bottom:37px}
.measure{min-width:0;padding:0 22px;border-right:1px solid var(--border)}.measure:first-child{padding-left:0}.measure:last-child{border:0}
.measure>span{display:block;color:#64796b;font-size:12px;margin-bottom:3px}
.measure strong{display:block;font-family:var(--font-display);font-size:clamp(31px,2vw,42px);font-weight:640;line-height:1.11;font-variant-numeric:tabular-nums;letter-spacing:-.05em;color:var(--text-deep)}
.measure strong em{font-size:16px;font-style:normal;color:#7b8f7e;letter-spacing:-.01em;font-weight:500}
.measure small{display:block;color:#5c7062;font-size:11px;margin-top:8px}
.workbench{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(285px,.86fr);gap:19px;align-items:stretch}
.surface{background:var(--surface);border:1px solid var(--border);min-width:0}
.data-surface{padding:28px clamp(22px,2vw,35px) 18px}.queue-surface{padding:28px 28px 18px}
.surface-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}
.surface-header h2{font-size:23px;color:#203c34;margin:0 0 6px}.surface-header p:not(.table-index){margin:0;color:#566d60;font-size:12px;line-height:1.6;max-width:60ch}
.table-index{font-size:11px;color:#678271;margin:0 0 10px;letter-spacing:.005em;font-weight:650}
.coverage-scroll{overflow-x:auto;max-width:100%;padding-bottom:9px;scrollbar-color:#b1bdb0 transparent}
.coverage-heatmap{display:grid;grid-template-columns:minmax(95px,1.65fr) repeat(14,minmax(20px,1fr));column-gap:5px;row-gap:11px;align-items:center;min-width:490px}
.hm-col{font-family:var(--font-mono);font-size:10px;color:#64796a;text-align:center;font-weight:570;padding:0 0 4px}
.hm-row{display:flex;flex-direction:column;align-items:flex-start;color:#234e41;font-size:12px;overflow:hidden;white-space:nowrap;gap:2px}
.hm-row b{font-size:13px;font-weight:740}.hm-row span{font-size:10px;color:#5f7668;text-overflow:ellipsis;overflow:hidden;max-width:100%}
.hm-cell{height:28px;display:block;border:1px solid #d8e0d8;background:#ecefeb;padding:0;border-radius:2px;transition:background .13s ease-out,border-color .13s;min-width:0}
.hm-cell:hover{background:#d6e4d5;border-color:#88b298}.hm-cell.done{background:#315f4d;border-color:#315f4d}
.hm-cell:focus-visible{position:relative;z-index:2}
.coverage-legend{display:flex;flex-wrap:wrap;gap:20px;margin-top:19px;color:#576e61;font-size:11px}
.legend-mark{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:middle;border:1px solid #d4ded5;background:#eef1eb}.legend-mark.confirmed{background:#315f4d;border-color:#315f4d}
.surface-foot{color:#597061;font-size:12px;line-height:1.6;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.gate-list{list-style:none;margin:0;padding:0}
.gate-list li{border-top:1px solid var(--border)}.gate-list li:last-child{border-bottom:1px solid var(--border)}
.gate-action{display:grid;grid-template-columns:30px minmax(0,1fr) 23px;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:14px 1px;color:var(--text)}
.gate-action:hover .gate-content b{color:#137048;text-decoration:underline;text-underline-offset:3px}
.gate-no{font-family:var(--font-mono);font-size:11px;color:#8c9b90}
.gate-content{display:flex;flex-direction:column;gap:2px}.gate-content b{font-size:13px;font-weight:690}.gate-content small{font-size:11px;color:#586f60;line-height:1.45}
.gate-symbol{font-size:15px;color:#547d59;text-align:right}
.queue-foot{font-size:11px;color:#596f60;line-height:1.5;margin-top:16px}
.method-band{display:grid;grid-template-columns:minmax(165px,.65fr) minmax(0,2fr);gap:38px;margin:44px 0 27px;padding:23px 0 0;border-top:1px solid var(--border-strong)}
.method-band h2{font-size:19px;max-width:18ch}
.method-band ol{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:0;padding:0}
.method-band li{border-top:2px solid #7c9482;padding:11px 0 5px;min-width:0}
.method-band li span{font-family:var(--font-mono);font-size:11px;color:#698271;display:block;margin-bottom:12px}
.method-band li b{display:block;font-size:13px;margin-bottom:4px;color:#254e3d}
.method-band li small{font-size:11px;color:#5d7262;line-height:1.5;display:block}
.research-footnote{display:grid;grid-template-columns:160px minmax(0,1fr);gap:37px;background:#e9ede6;padding:19px 22px;color:#4b6555;margin-top:25px}
.research-footnote span{font-size:12px;font-weight:700;color:#365944}.research-footnote p{margin:0;font-size:12px;line-height:1.7}
/* Forms, data views, and structured comparisons. */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.grid .wide{grid-column:span 2}
.columns{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.85fr);gap:17px}
.card,.hint,.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:2px;min-width:0}
.card{padding:26px 28px}
.card p{font-size:13px;line-height:1.7;color:#65786c;margin:0 0 10px}
.candidate{padding:22px 26px 20px}.candidate .code{display:inline-block;font-family:var(--font-mono);color:#3f7756;font-size:12px;margin-bottom:15px}
.candidate h3{font-size:21px;max-width:27ch}
.candidate .info{border-top:1px solid var(--border);margin-top:18px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:#637769}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:37px 0 17px}
.panel-heading h2{font-size:21px}
.section-title{font-size:21px!important;margin:36px 0 16px!important}
.tablewrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}
thead th{position:sticky;top:0;background:#eaf0e9;color:#4f6b5d;font-weight:700;font-size:11px;padding:15px 15px;letter-spacing:0;white-space:nowrap}
td{border-top:1px solid var(--border);padding:13px 15px;vertical-align:top;color:#3d554c;line-height:1.6}
td:first-child{font-weight:650;color:#285d48}
tbody tr:hover td{background:#f4f7f2}
.pill{display:inline-flex;border:1px solid #d4e3cf;background:#edf4e9;color:#3c6348;border-radius:3px;padding:5px 8px;font-weight:650;font-size:11px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;min-height:43px;padding:10px 16px;border-radius:3px;background:#f7faf5;border:1px solid #bfcfbe;font-size:12px;line-height:1.4;font-weight:700;color:#355e4d;transition:background .14s ease-out,border-color .14s ease-out}
.btn:hover:not(:disabled){background:#e5eee2;border-color:#91aa8c}
.btn.primary{background:var(--forest-deep);color:#f2f5ed;border-color:var(--forest-deep)}
.btn.primary:hover:not(:disabled){background:#254a3c}
.btn.secondary{background:transparent}
.field label{display:block;font-weight:670;font-size:12px;color:#455f53;margin:0 0 7px}
.field input,.field select,.field textarea,.edit-row input,select:not(.unstyled){border:1px solid #c3d0c4;background:#fff;color:#1b3d32;border-radius:2px;min-height:42px;padding:9px 12px;font-size:13px;max-width:100%}
.field input,.field select,.field textarea{width:100%}
.field textarea{resize:vertical;min-height:92px}
.field small{font-size:11px;color:#596f61;display:block;margin-top:5px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.edit-row{display:grid;grid-template-columns:61px minmax(130px,1.35fr) minmax(90px,.65fr) 96px minmax(160px,1.2fr) 79px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.edit-row:last-child{border:0}
.edit-row>span{min-width:0}.edit-row .code{font-family:var(--font-mono);font-size:11px;color:#285e4e;font-weight:700}
.edit-row .name{font-size:12px;line-height:1.35}.edit-row .units{font-size:11px;color:#7d8c81}
.edit-row input{width:100%;min-width:0}.edit-row .confirm{display:flex;align-items:center;gap:5px;font-size:11px;color:#526a5e}
.edit-row .confirm input,.confirm input{width:auto;min-height:0;accent-color:#346347}
.caption{font-size:11px!important;line-height:1.7!important;color:#697d70!important}
.muted{color:#738579}
.hint{padding:16px 19px;line-height:1.6;color:#61786c;font-size:12px}
.callout{background:#e8eee6;border:1px solid #ceddcf;border-radius:2px;padding:15px 20px;margin:23px 0;color:#456551;font-size:12px;line-height:1.75}
.callout.note-red{background:var(--caution-bg);border-color:#e3d2bc;color:#77583b}
.method-list{margin:0;padding-left:19px;color:#5f7266;font-size:12px;line-height:1.85}
.pipeline{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pipeline span{padding:8px 12px;background:#eef3e9;border:1px solid #d8e3d7;border-radius:2px;font-size:11px;color:#43624d}
.empty{text-align:left;padding:35px 26px;font-size:13px;color:#62796b;line-height:1.7}.empty strong{display:block;font-size:16px;color:#294c3d;margin-bottom:9px}
.audit{font-family:var(--font-mono);font-size:11px;color:#5a7462;line-height:1.8;list-style:disc;padding-left:20px}
.audit li{margin-bottom:10px;overflow-wrap:anywhere}
.fineprint,.slim{font-size:12px;color:#708276}
.stack{display:flex;flex-direction:column;gap:14px}
.mini-rank{height:6px;background:#e2eae0;overflow:hidden;margin-top:8px;max-width:180px}
.mini-rank-fill{height:100%;background:#3e7c58}
.score-strong{font-variant-numeric:tabular-nums;color:#26634c;font-weight:760}
footer{border-top:1px solid var(--border);padding-top:22px;margin-top:35px;font-size:11px;color:#78897b}
/* Responsive workspaces. Wide viewports get additional analytical space, not stretched type. */
@media(min-width:1700px){
  :root{--sidebar:285px}
  .main{padding-inline:clamp(60px,4vw,94px)}
  .workbench{grid-template-columns:minmax(0,1.95fr) minmax(330px,.85fr);gap:23px}
  .brief-top{grid-template-columns:minmax(0,1fr) 310px;gap:95px}
  .coverage-heatmap{column-gap:8px}
  .hm-cell{height:34px}
  .surface{min-height:370px}
}
@media(min-width:2100px){
 .main{max-width:1960px;margin-inline:auto}
}
@media(max-width:1320px){
  :root{--sidebar:235px}
  .main{padding-inline:29px}
  .brief-top{gap:36px}
  .workbench{grid-template-columns:minmax(0,1.5fr) minmax(265px,.85fr)}
  .edit-row{grid-template-columns:60px minmax(140px,1fr) minmax(70px,.55fr) minmax(135px,.9fr) 75px}
  .edit-row .units{display:none}
}
@media(max-width:1070px){
  .brief-top{grid-template-columns:1fr}
  .brief-aside{display:none}
  .workbench{grid-template-columns:1fr}
  .measures{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:19px}
  .measure:nth-child(2){border:0}.measure:nth-child(3){padding-left:0}
  .method-band{grid-template-columns:1fr;gap:20px}
  .method-band h2{max-width:none}
  .columns{grid-template-columns:1fr}
}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:relative;height:auto;min-height:0;padding:15px 17px 10px}
  .brand{padding:0 0 12px;border:0}.brand strong{font-size:17px}.crossing-mark{width:34px;height:34px}
  .rail-section,.rail-progress,.rail-foot{display:none}
  .rail nav{display:flex;flex-direction:row;gap:3px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
  .nav{width:auto;flex:none;white-space:nowrap;padding:8px 12px;min-height:40px}
  .topbar{min-height:54px;padding:0 19px}
  .main{padding:28px 20px 73px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:650px){
  .top-context{display:none}.state{font-size:10px;white-space:normal;line-height:1.3;text-align:right;max-width:155px}
  .main{padding:24px 15px 64px}
  .brief-intro h1{font-size:clamp(33px,9vw,45px);letter-spacing:-.045em;max-width:100%}
  .brief-intro>p{font-size:14px}
  .brief-top{margin-bottom:24px}.brief-actions{align-items:flex-start;gap:12px}.brief-actions>span{display:block;width:100%}
  .measures{gap:0;margin-bottom:22px;padding:15px 0;row-gap:18px}
  .measure{padding:0 10px}.measure:nth-child(odd){padding-left:0}
  .measure strong{font-size:30px}.measure strong em{font-size:12px}.measure small{font-size:10px}
  .surface-header{flex-wrap:wrap}.surface-header .btn{width:100%}
  .data-surface,.queue-surface{padding:18px 16px}
  .surface-header h2{font-size:21px}
  .method-band ol{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .research-footnote{grid-template-columns:1fr;gap:7px}
  .grid,.formgrid{grid-template-columns:1fr}.grid .wide{grid-column:auto}
  .card{padding:21px 18px}.panel-heading{flex-wrap:wrap}
  .edit-row{grid-template-columns:55px minmax(0,1fr) 85px;gap:8px}
  .edit-row .name{grid-column:2 / 4}
  .edit-row input[data-src]{grid-column:2 / 4}
  .edit-row .units{display:none}.edit-row .confirm{grid-column:3}
  .edit-row input[data-val]{grid-column:2}

  const next=gates.find(g=>!g.done);
  return `<div class="brief-top"><div class="brief-intro"><div class="brief-index">Observatorium Mobilitas / Jatinangor</div><h1>Prioritas penyeberangan, berdasarkan bukti.</h1><p>Empat kandidat lokasi. Lima kelompok kriteria. Satu alur penilaian yang bisa ditelusuri dari survei sampai rekomendasi kajian teknis.</p><div class="brief-actions"><button class="btn primary" data-screen="${next?.step||'peringkat'}">${next?'Lanjutkan: '+next.name:'Lihat hasil TOPSIS'} <span aria-hidden="true">↗</span></button><span>Model konseptual · data lapangan belum disediakan</span></div></div><div class="brief-aside"><p class="brief-aside-title">Dasar perhitungan</p><dl><div><dt>Pembobotan</dt><dd>Fuzzy AHP</dd></div><div><dt>Pengurutan</dt><dd>TOPSIS</dd></div><div><dt>Verifikasi</dt><dd>Observasi IoT</dd></div></dl><p>Hasil merupakan prioritas kajian, bukan persetujuan konstruksi.</p></div></div>
  <section class="measures" aria-label="Status dataset"><div class="measure"><span>Kandidat awal</span><strong>04</strong><small>Didefinisikan oleh paper</small></div><div class="measure"><span>Subkriteria</span><strong>14</strong><small>5 kelompok · Tabel II</small></div><div class="measure"><span>Rekam data valid</span><strong>${count}<em> / 56</em></strong><small>${Math.round(100*count/56)}% catatan memenuhi prasyarat</small></div><div class="measure"><span>Lokasi terkonfirmasi</span><strong>${confirmed}<em> / 4</em></strong><small>Identitas titik, bukan validasi JPO</small></div></section>
  <div class="workbench"><section class="surface data-surface"><div class="surface-header"><div><p class="table-index">Tabel kerja / A1—A4 × C1.1—C5.3</p><h2>Matriks keterisian</h2><p>Setiap sel membuka data kandidat terkait. Warna hanya menunjukkan kelengkapan sumber dan nilai.</p></div><button class="btn secondary" data-screen="kriteria">Buka data kriteria</button></div>${heatmap}<div class="coverage-legend"><span><i class="legend-mark confirmed"></i>Catatan ditinjau</span><span><i class="legend-mark empty-mark"></i>Belum lengkap</span></div><div class="surface-foot">${count===56?'Seluruh 56 catatan memenuhi pemeriksaan format. Periksa keabsahan sumber sebelum memutuskan.':`Masih ada ${56-count} catatan yang memerlukan nilai dan sumber. Nilai kosong tidak dikonversi menjadi nol.`}</div></section>
  <aside class="surface queue-surface"><div class="surface-header"><div><p class="table-index">Urutan pekerjaan</p><h2>Kesiapan analisis</h2><p>Setiap tahap bergantung pada data sebelumnya.</p></div></div><ol class="gate-list">${gates.map((g,i)=>`<li><button class="gate-action" data-screen="${g.step}"><span class="gate-no">${String(i+1).padStart(2,'0')}</span><span class="gate-content"><b>${g.name}</b><small>${g.detail}</small></span><span class="gate-symbol" aria-hidden="true">${g.done?'✓':'↗'}</span></button></li>`).join('')}</ol><div class="queue-foot">${store.baseline?'Peringkat awal tersedia untuk pemeriksaan.':'TOPSIS belum dapat dijalankan sebelum input dan bobot lengkap.'}</div></aside></div>
  <section class="method-band"><div><p class="table-index">Rancangan metode</p><h2>Dari pengukuran menuju keputusan</h2></div><ol><li><span>01</span><b>Data</b><small>Konfirmasi sumber, unit, dan periode.</small></li><li><span>02</span><b>Fuzzy AHP</b><small>Bobot pakar dan konsistensi.</small></li><li><span>03</span><b>TOPSIS</b><small>Peringkat dan sensitivitas.</small></li><li><span>04</span><b>IoT</b><small>Agregat terverifikasi dan peringkat ulang.</small></li></ol></section>
  <div class="research-footnote"><span>Lingkup keputusan</span><p>JPO adalah salah satu jenis penyeberangan. Model hanya mengurutkan kebutuhan <em>kajian lebih lanjut</em>; pemilihan jenis fasilitas, keselamatan geometrik, ketersediaan lahan, dan konstruksi tetap memerlukan penilaian teknis. Tidak ada koordinat, data survei, atau bobot pakar bawaan yang dianggap sebagai fakta Jatinangor.</p></div>`;
}
function render(){document.getElementById('nav').innerHTML=screens.map(([id,label])=>`<button class="nav ${screen===id?'active':''}" data-screen="${id}" aria-current="${screen===id?'page':'false'}"><span class="nav-step">${label.slice(0,2)}</span>${label.replace(/^\d+ · /,'')}</button>`).join('');const rp=document.getElementById('railProgress');if(rp){const n=recordCount();rp.innerHTML=`<small>Kelengkapan data</small><strong>${n} / 56</strong><div class="progress-track"><div class="progress-fill" style="width:${100*n/56}%"></div></div><span>Data survei dengan sumber; bukan hasil otomatis.</span>`;}document.getElementById('crumb').textContent='Kajian JPO / '+screens.find(x=>x[0]===screen)[1].replace(/^\d+ · /,'');const main=document.getElementById('main');const handlers={ringkasan:overviewView,kandidat:candidatesView,kriteria:matrixView,bobot:expertView,peringkat:rankingView,iot:iotView,audit:auditView};main.innerHTML=handlers[screen]();}
function updateRecord(key,field,value){const id=store.candidate+'|'+key;const d=store.records[id]||{value:'',source:'',checked:false};if(field==='checked'&&value){const trial={...d,checked:true};if(!completeRecord(trial,crit.find(x=>x[0]===key))){alert('Masukkan nilai valid beserta sumber dan periode. Untuk ordinal, gunakan bilangan bulat 1–5.');render();return;}}if(field!=='checked'&&d.checked)d.checked=false;d[field]=value;store.records[id]=d;invalidate('Perubahan input '+id);render();}
function updateExpertPair(pair,value){const e=store.experts[store.activeExpert];e.pairs[store.activeLevel]??={};if(value==='')delete e.pairs[store.activeLevel][pair];else e.pairs[store.activeLevel][pair]=Number(value);invalidate('Perbandingan pakar diperbarui');render();}
function computeWeights(){if(!store.approvedMethod){alert('Konfirmasi aturan metode implementasi terlebih dahulu.');return}try{store.weights=E.buildWeights(store.experts,[4,2,2,3,3]);store.baseline=null;store.observations=[];log('Bobot dihitung dari penilaian pakar; CR diperiksa.');screen='bobot';render();}catch(e){alert('Bobot belum dapat dihitung. '+e.message)}}
function computeRanking(){const r=readiness();if(!r.ready){alert('Prasyarat belum lengkap.');return}try{const matrix=getMatrix(),weights=store.weights.weights;const result=rankWith(matrix,weights),crispResult=rankWith(matrix,store.weights.crispWeights),sensitivity=E.sensitivity(matrix,weights,crit.map(x=>x[3]),[4,2,2,3,3]);store.baseline={created:new Date().toISOString(),matrix,weights:[...weights],result,crispResult,sensitivity};store.observations=[];log('Baseline TOPSIS dihitung dan dikunci (prioritas kajian, bukan keputusan membangun).');render();}catch(e){alert('TOPSIS ditolak: '+e.message)}}
function submitIot(){if(!store.baseline)return;const value=id=>document.getElementById(id)?.value?.trim()??'';const can=value('iotCandidate'),start=value('iotStart'),end=value('iotEnd'),source=value('iotSource'),reviewer=value('iotReviewer'),quality=!!document.getElementById('iotQuality').checked;const cars=Number(value('iotCars')),peds=Number(value('iotPeds')),peak=Number(value('iotPeak')),isSpeed=value('iotCalibrated')==='yes',speedRaw=value('iotSpeed');const speed=isSpeed&&speedRaw!==''?Number(speedRaw):null;const duration=(new Date(end)-new Date(start))/60000;
const allIntegers=[value('iotCars'),value('iotPeds'),value('iotPeak')].every(x=>x!==''&&Number.isInteger(Number(x))&&Number(x)>=0);
if(!candidates.some(c=>c.id===can)||!start||!end||!Number.isFinite(duration)||duration<15||!allIntegers||peak>peds||!source||!reviewer||!quality){alert('Periksa kandidat, awal/akhir observasi (minimal 15 menit), hitungan bulat non-negatif, puncak ≤ total, bukti, penelaah, dan persetujuan mutu.');return}
if(isSpeed&&(!Number.isFinite(speed)||speed<=0)){alert('Kecepatan harus numerik dan terkalibrasi jika diaktifkan.');return}
if(store.observations.some(x=>x.candidate===can)){alert('Lokasi ini telah memiliki satu ringkasan pada baseline. Perbaiki melalui baseline baru atau ekspor dahulu sebelum membuat sesi berikutnya.');return}
if(store.observations.length&&store.observations.some(x=>x.start!==start||x.end!==end)){alert('Periode pengamatan lintas lokasi harus sama untuk membandingkan data observasi.');return}
const obs={candidate:can,start,end,minutes:duration,cars,peds,peak,carsPerHour:cars*60/duration,pedsPerHour:peds*60/duration,speed,source,reviewer,qualityConfirmed:true};store.observations.push(obs);log(`Observasi agregat ${can} (${start}–${end}) oleh ${reviewer} ditambahkan; status pemeriksaan hanya dari input pengguna.`);render();}
function exportData(){const s={schema:'jpo-dss-prototype-1',status:'USER_INPUT_NOT_GROUND_TRUTH',paper:'Model Pendukung Keputusan untuk Memprioritaskan Lokasi Jembatan Penyeberangan Orang di Jatinangor',exportedAt:new Date().toISOString(),data:store};const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jpo-dss-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);log('Snapshot JSON diekspor.');}
async function previewIoTAggregate(file){
 try{
  if(!store.baseline)throw Error('Peringkat baseline belum tersedia.');
  if(file.size>200000)throw Error('Berkas terlalu besar untuk agregat pengamatan.');
  const d=JSON.parse(await file.text());
  if(d.schema!=='jpo-iot-aggregate-1'||!d.observation||typeof d.observation!=='object')throw Error('Skema JSON tidak dikenali.');
  const o=d.observation;
  const required=['candidate','start','end','cars','peds','peak','source'];
  for(const k of required)if(o[k]===undefined||o[k]===null||String(o[k]).trim()==='')throw Error('Kolom wajib kosong: '+k);
  if(!candidates.some(c=>c.id===o.candidate))throw Error('Kode kandidat tidak sesuai paper.');
  for(const k of ['cars','peds','peak'])if(!Number.isInteger(Number(o[k]))||Number(o[k])<0)throw Error('Hitungan harus bilangan bulat non-negatif: '+k);
  if(Number(o.peak)>Number(o.peds))throw Error('Puncak 15 menit melampaui total pedestrian.');
  if(o.speed!==null&&o.speed!==undefined&&!Number.isFinite(Number(o.speed)))throw Error('Kecepatan tidak valid.');
  const ids={candidate:'iotCandidate',start:'iotStart',end:'iotEnd',cars:'iotCars',peds:'iotPeds',peak:'iotPeak',source:'iotSource'};
  for(const [key,id] of Object.entries(ids))document.getElementById(id).value=String(o[key]);
  document.getElementById('iotSpeed').value=o.speed===null||o.speed===undefined?'':String(o.speed);
  document.getElementById('iotCalibrated').value=o.speedCalibrated===true?'yes':'no';
  document.getElementById('iotReviewer').value='';
  document.getElementById('iotQuality').checked=false;
  log('Agregat IoT diimpor sebagai draft belum diverifikasi; menunggu pemeriksaan penelaah.');
  alert('Agregat telah dimuat ke formulir. Periksa periode, sumber, kalibrasi, dan kecocokan hitungan sebelum menandai kualitas dan menyimpan observasi.');
 }catch(e){alert('Impor agregat ditolak: '+e.message)}
}
function exportRankingCSV(){
 if(!store.baseline)return;
 const b=store.baseline;
 const rows=[['Jenis','ID','Kandidat','Peringkat','C_star','D_plus','D_minus','Status_teknis','Data_status'],...b.result.ranked.map(x=>['PRIORITAS_KAJIAN',candidates[x.index].id,candidates[x.index].name,x.rank,x.score,x.dPlus,x.dMinus,store.confirmed[candidates[x.index].id]?.technicalStatus||'pending','INPUT_PENGGUNA_BELUM_TERVERIFIKASI_INDEPENDEN'])];
 const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download='jpo-prioritas-kajian-topsis.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);log('Peringkat baseline diekspor menjadi CSV.');render();
}
async function importData(file){try{const text=await file.text();if(text.length>4e6)throw Error('Berkas terlalu besar');let js=JSON.parse(text);if(js.schema!=='jpo-dss-prototype-1'||!js.data||typeof js.data!=='object')throw Error('Skema tidak sesuai');let obj=js.data;if(!Array.isArray(obj.experts)||obj.experts.length<1||obj.experts.length>30||!obj.records||typeof obj.records!=='object'||!obj.confirmed||typeof obj.confirmed!=='object'||!Array.isArray(obj.observations)||obj.observations.length>4)throw Error('Struktur tidak sah');store={...obj,weights:null,baseline:null,observations:[],audit:Array.isArray(obj.audit)?obj.audit.slice(-499):[]};store.activeExpert=0;store.activeLevel='main';store.candidate='A1';store.approvedMethod=false;log('Draft masukan diimpor. Hasil kalkulasi ditolak untuk dihitung ulang melalui validasi.');screen='ringkasan';render();alert('Masukan diimpor. Metode, bobot, dan baseline perlu dihitung ulang agar tidak memakai hasil kalkulasi dari berkas yang tidak tepercaya.')}catch(e){alert('Tidak dapat mengimpor berkas: '+e.message)}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-screen]');if(n){screen=n.dataset.screen;render();return}const hm=e.target.closest('[data-hm]');if(hm){store.candidate=hm.dataset.hm;screen='kriteria';render();return}const ed=e.target.closest('[data-edit]');if(ed){store.candidate=ed.dataset.edit;screen='kriteria';render();return}const exp=e.target.closest('[data-expert]');if(exp){store.activeExpert=Number(exp.dataset.expert);render();return}switch(e.target.id){case 'addExpert':store.experts.push({name:'',pairs:{}});store.activeExpert=store.experts.length-1;invalidate('Pakar ditambahkan');render();break;case 'computeWeights':computeWeights();break;case 'computeRanking':computeRanking();break;case 'submitIot':submitIot();break;case 'exportJSON':exportData();break;case 'exportRankingCSV':exportRankingCSV();break;}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='pickCandidate'){store.candidate=el.value;render();return}if(el.dataset.val!==undefined){updateRecord(el.dataset.val,'value',el.value);return}if(el.dataset.src!==undefined){updateRecord(el.dataset.src,'source',el.value);return}if(el.dataset.check!==undefined){updateRecord(el.dataset.check,'checked',el.checked);return}if(el.dataset.locationSource!==undefined||el.dataset.locationLat!==undefined||el.dataset.locationLon!==undefined||el.dataset.verifiedName!==undefined){let id=el.dataset.locationSource??el.dataset.locationLat??el.dataset.locationLon??el.dataset.verifiedName;let d=store.confirmed[id]||{};if(el.dataset.locationSource!==undefined)d.reference=el.value;else if(el.dataset.locationLat!==undefined)d.lat=el.value;else if(el.dataset.locationLon!==undefined)d.lon=el.value;else d.verifiedName=el.value;d.checked=false;store.confirmed[id]=d;invalidate('Identitas/koordinat lokasi diperbarui');render();return}if(el.dataset.facilityReview!==undefined){let id=el.dataset.facilityReview;let d=store.confirmed[id]||{};d.technicalStatus=el.value;store.confirmed[id]=d;invalidate('Status penapisan teknis berubah');render();return}if(el.dataset.locationCheck!==undefined){let d=store.confirmed[el.dataset.locationCheck]||{};if(el.checked&&!String(d.reference||'').trim()){alert('Isi rujukan konfirmasi lokasi dahulu.');render();return}if(el.checked&&(String(d.lat??'').trim()!==''||String(d.lon??'').trim()!=='')&&!coordinateValid(d)){alert('Jika koordinat diisi, latitude dan longitude harus lengkap dan valid. Koordinat opsional untuk TOPSIS, tetapi wajib untuk plot lokasi.');render();return}if(el.checked&&el.dataset.locationCheck==='A4'&&!String(d.verifiedName||'').trim()){alert('Nama titik A4 yang tepat harus dikonfirmasi karena paper menggunakan dua sebutan yang berbeda.');render();return}d.checked=el.checked;store.confirmed[el.dataset.locationCheck]=d;invalidate('Status konfirmasi lokasi berubah');render();return}if(el.id==='methodApproval'){store.approvedMethod=el.checked;invalidate('Konfigurasi metode berubah');render();return}if(el.id==='expertName'){store.experts[store.activeExpert].name=el.value;invalidate('Nama pakar diubah');render();return}if(el.id==='levelSelect'){store.activeLevel=el.value;render();return}if(el.dataset.pair!==undefined){updateExpertPair(el.dataset.pair,el.value);return}if(el.id==='importJSON'&&el.files?.[0]){importData(el.files[0]);return}if(el.id==='importIoTAggregate'&&el.files?.[0]){previewIoTAggregate(el.files[0]);return}});
render();

</script>
