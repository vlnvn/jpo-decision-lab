name: Validate
on:
  push:
  pull_request:
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Mathematical checks
        run: node test_engine.js
      - name: Rebuild standalone application
        run: python build_offline.py
      - name: Verify checked-in build
        run: git diff --exit-code -- JPO_DSS_OFFLINE.html
      - name: Check Python syntax
        run: python -m compileall -q build_offline.py tests/
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser and responsive tests
        run: |
          python tests/test_ui.py
          python tests/qa_extended.py